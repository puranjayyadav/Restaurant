name: Backfill Geocode (Supabase)

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Best-effort install; requirements may be heavy but needed for supabase client deps
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt || true; fi
          # Ensure supabase and requests are present
          python -m pip install "supabase" "requests"

      - name: Run backfill (yelp + scrapedrestaurant)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BATCH_SIZE: "100"
          LEMON8_LIMIT: "100"
        run: |
          python backfill_yelp_locations_sample.py

