name: Lemon8 Snowball Crawler

on:
  schedule:
    # Run Scout every 30 minutes to discover new URLs
    - cron: '*/30 * * * *'
    # Run Miner every hour to process queue
    - cron: '0 * * * *'
    # Run Reprocess daily at 3 AM to retry failed extractions
    - cron: '0 3 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  scout:
    name: Scout - Discover URLs
    runs-on: ubuntu-latest
    if: github.event.schedule == '*/30 * * * *' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          sudo ln -s /usr/bin/chromium-browser /usr/bin/chromium || true
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install selenium
          echo "Verifying selenium installation..."
          python -c "import selenium; print(f'✓ Selenium version: {selenium.__version__}')" || (echo "✗ ERROR: Selenium not installed!" && exit 1)
          python -c "import sys; print(f'Python path: {sys.executable}')"
          pip show selenium || echo "Warning: pip show selenium failed"
      
      - name: Verify ChromeDriver
        run: |
          echo "Testing ChromeDriver installation..."
          chromium-browser --version || echo "Chromium version check failed"
          chromedriver --version || echo "ChromeDriver version check failed"
          echo "Verifying selenium is available..."
          python -c "import selenium; print('✓ Selenium is available')" || (echo "✗ Selenium import failed!" && exit 1)
          echo "Testing Selenium WebDriver..."
          python -c "
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--disable-software-rasterizer')
          opts.add_argument('--window-size=1920,1080')
          opts.add_argument('--single-process')
          opts.binary_location = '/usr/bin/chromium-browser'
          try:
              service = Service()
              d = webdriver.Chrome(service=service, options=opts)
              d.set_page_load_timeout(10)
              d.get('https://www.google.com')
              print('✓ ChromeDriver test successful!')
              d.quit()
          except Exception as e:
              print(f'✗ ChromeDriver test failed: {e}')
              import traceback
              traceback.print_exc()
              exit(1)
          "
      
      - name: Run Scout
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # Process first 20 URLs per run to avoid timeout (GitHub Actions has time limits)
          # The script will generate ~400+ URLs, but we'll process them in batches
          # Use -u flag for unbuffered output and tee to capture logs
          python -u scout_lemon8.py 20 2>&1 | tee scout_output.log
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-logs
          path: |
            *.log
            *.txt

  miner:
    name: Miner - Process Queue
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          sudo ln -s /usr/bin/chromium-browser /usr/bin/chromium || true
          # Ensure ChromeDriver is in PATH
          sudo ln -sf /usr/bin/chromedriver /usr/local/bin/chromedriver || true
          # Verify installations
          chromium-browser --version
          chromedriver --version
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install selenium
      
      - name: Run Miner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python miner_lemon8.py 10  # Process 10 URLs per run
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miner-logs
          path: |
            *.log
            *.txt

  reprocess:
    name: Reprocess - Retry Failed Extractions
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Reprocess
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Reprocess up to 20 failed extractions per run
          # This retries articles that failed LLM extraction
          python reprocess_failed_extractions.py 20
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reprocess-logs
          path: |
            *.log
            *.txt
