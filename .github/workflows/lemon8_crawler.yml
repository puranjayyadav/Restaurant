name: Lemon8 Snowball Crawler

on:
  schedule:
    # Run Scout every 6 hours to discover new URLs
    - cron: '0 */6 * * *'
    # Run Miner every 2 hours to process queue
    - cron: '0 */2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  scout:
    name: Scout - Discover URLs
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          sudo ln -s /usr/bin/chromium-browser /usr/bin/chromium || true
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install selenium
      
      - name: Run Scout
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scout_lemon8.py "https://www.lemon8-app.com/experience/new-york-eat?region=us"
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: scout-logs
          path: |
            *.log
            *.txt

  miner:
    name: Miner - Process Queue
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 */2 * * *' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          sudo ln -s /usr/bin/chromium-browser /usr/bin/chromium || true
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install selenium
      
      - name: Run Miner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python miner_lemon8.py 10  # Process 10 URLs per run
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: miner-logs
          path: |
            *.log
            *.txt
