name: Generate Place Insights

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of places to analyze'
        required: false
        default: '1000'

jobs:
  generate-insights:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests supabase python-decouple

      - name: Run Insights Generator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Use input limit if manually triggered, otherwise default to 1000
          LIMIT="${{ github.event.inputs.limit || '1000' }}"
          echo "🚀 Starting analysis for $LIMIT venues..."
          python google_maps_scraper/generate_place_insights.py $LIMIT
