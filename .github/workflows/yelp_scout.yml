name: Yelp URL Scout

on:
  schedule:
    # Run Yelp Scout every 30 minutes to discover Yelp URLs from Lemon8 articles
    - cron: '*/30 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  scout_yelp:
    name: Scout Yelp - Discover Yelp URLs from Lemon8
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          sudo ln -s /usr/bin/chromium-browser /usr/bin/chromium || true
          # Ensure ChromeDriver is in PATH
          sudo ln -sf /usr/bin/chromedriver /usr/local/bin/chromedriver || true
          # Verify installations
          chromium-browser --version
          chromedriver --version
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install selenium
      
      - name: Run Yelp Scout
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # Process 100 restaurants per batch
          # The script automatically tracks which articles have been processed
          # Next run will continue from where this one left off
          python -u scout_yelp_from_lemon8.py --limit 100 2>&1 | tee scout_yelp_output.log
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-yelp-logs
          path: |
            *.log
            *.txt

