name: Geocode Lemon8 Articles

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  geocode:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Geocode unprocessed articles
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SLEEP_SECONDS: 1.1
        NOMINATIM_EMAIL: ${{ secrets.NOMINATIM_EMAIL }}
      run: |
        python geocode_single_article.py --batch --limit 50
      continue-on-error: true  # Don't fail the workflow if some articles fail
    
    - name: Summary
      if: always()
      run: |
        echo "Geocoding job completed. Check logs above for details."





