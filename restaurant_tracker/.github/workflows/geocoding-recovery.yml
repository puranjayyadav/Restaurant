name: Geocoding Full Recovery

on:
  schedule:
    - cron: "0 * * * *" # Every hour on the hour
  workflow_dispatch: # Allow manual trigger

jobs:
  recover-geocodes:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # Geocoding can take a while if processing 200+ articles
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Ensure core dependencies for geocoding are installed
          pip install requests supabase python-decouple

      - name: Run Geocoding Recovery Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NOMINATIM_EMAIL: ${{ secrets.NOMINATIM_EMAIL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SLEEP_SECONDS: "1.5" # Slightly higher delay for public APIs in CI
        run: |
          python retry_failed_geocodes.py
